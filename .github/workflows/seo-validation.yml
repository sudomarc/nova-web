name: Website SEO validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seo:
    name: Validate public SEO and GEO metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static SEO and GEO tests
        run: node --test tests/seo.test.mjs
